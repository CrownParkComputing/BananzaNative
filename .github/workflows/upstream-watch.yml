name: upstream watch
# Daily: is NotRexed/Hookshot past the commit this fork last merged (.upstream-sha)? Then one issue, kept up to date.
on:
  schedule: [{cron: "17 6 * * *"}]
  workflow_dispatch:
permissions: {issues: write, contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: compare with upstream
        id: cmp
        run: |
          git remote add upstream https://github.com/NotRexed/Hookshot.git
          git fetch -q upstream main
          LAST=$(cat .upstream-sha); NEW=$(git rev-parse upstream/main)
          if [ "$LAST" = "$NEW" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          { echo "Upstream Hookshot moved from \`$LAST\` to \`$NEW\` ($(git rev-list --count $LAST..$NEW) commits):"; echo; echo '```';
            git log --oneline $LAST..$NEW | head -60; echo '```'; echo;
            echo "Merge locally with \`scripts/upstream-check.sh --merge\`, rebuild (lift + build), test, then \`scripts/upstream-check.sh --mark\`."; } > body.md
      - name: open or update the issue
        if: steps.cmp.outputs.changed == 'true'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          T="Upstream Hookshot has new commits"
          # (REST, not GraphQL: the workflow token's createIssue mutation is refused as "not accessible by integration")
          R=${{ github.repository }}
          N=$(gh api "repos/$R/issues?state=open&per_page=50" --jq ".[] | select(.title == \"$T\") | .number" | head -1)
          if [ -n "$N" ]; then gh api -X PATCH "repos/$R/issues/$N" -F body=@body.md > /dev/null
          else gh api -X POST "repos/$R/issues" -f title="$T" -F body=@body.md > /dev/null; fi
